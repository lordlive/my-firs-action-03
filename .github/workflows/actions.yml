name: complex

on:
  push:
    branches:
      - rc-*
  pull_request:
    branches:
      - main

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - run: date +%Y-%m-%d

  windows:
    runs-on: windows-latest
    steps:
      - run: date
    
  macos:  
    runs-on: macos-latest
    steps:
      - run: date

  depends:
    runs-on: ubuntu-latest
    needs: [ubuntu, macos, windows]
    steps:
    - run: echo "All jobs are done"
